# Apache 2.4 reference config for the Portfolio CMS.
#
# The public site is served as plain static files from
# /var/www/html/staticportfolio/public/ — regenerated by the admin app
# on every Publish. The admin lives behind a reverse proxy to a Node
# process on 127.0.0.1:3000.
#
# Required Apache modules: proxy, proxy_http, headers.
#   a2enmod proxy proxy_http headers
#   systemctl reload apache2
#
# Adapt paths and ServerName for your install. Two layouts are shown:
#   (A) site at the root of a hostname    — uncomment block A
#   (B) site under a /staticportfolio/    — uncomment block B (current setup)

# ─── (A) Site at the root of its own hostname ──────────────────────────
#
#   <VirtualHost *:80>
#     ServerName portfolio.example.com
#     DocumentRoot /var/www/html/staticportfolio/public
#
#     <Directory /var/www/html/staticportfolio/public>
#       Options -Indexes +FollowSymLinks
#       AllowOverride None
#       Require all granted
#     </Directory>
#
#     # ErrorDocument 404 /404.html
#
#     ProxyPreserveHost On
#     ProxyPass        /admin/ http://127.0.0.1:3000/admin/
#     ProxyPassReverse /admin/ http://127.0.0.1:3000/admin/
#
#     # Optional: long cache for fingerprinted/hashed assets if you add them later.
#     <FilesMatch "\.(woff2|css|js|jpg|jpeg|png|svg|webp)$">
#       Header set Cache-Control "public, max-age=2592000"
#     </FilesMatch>
#   </VirtualHost>

# ─── (B) Site mounted at /staticportfolio/ on a shared host ────────────
#
# This is the current layout: Tailscale serves /staticportfolio/* into
# Apache, which then serves files from /var/www/html/staticportfolio/public/
# and reverse-proxies /staticportfolio/admin/* to Node.
#
# This block goes inside an existing <VirtualHost>:

Alias /staticportfolio /var/www/html/staticportfolio/public

<Directory /var/www/html/staticportfolio/public>
  Options -Indexes +FollowSymLinks
  AllowOverride None
  Require all granted

  # Serve .html when the path lacks an extension (matches the legacy URLs).
  RewriteEngine On
  RewriteCond %{REQUEST_FILENAME} !-f
  RewriteCond %{REQUEST_FILENAME}.html -f
  RewriteRule ^(.+)$ $1.html [L]

  ErrorDocument 404 /staticportfolio/404.html
</Directory>

ProxyPreserveHost On
ProxyPass        /staticportfolio/admin/ http://127.0.0.1:3000/admin/
ProxyPassReverse /staticportfolio/admin/ http://127.0.0.1:3000/admin/

# Long cache for fonts and other static assets. Adjust to taste.
<LocationMatch "^/staticportfolio/assets/(fonts|img|css|js)/">
  Header set Cache-Control "public, max-age=2592000"
</LocationMatch>

# Compressed text where Apache can do it cheaply.
<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/css application/javascript application/xml application/rss+xml
</IfModule>
